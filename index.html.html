<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<meta name="theme-color" content="#000000"/>
<title>GAARO · Enroll a face</title>
<style>
  :root{ --bg:#000; --ink:#fff; --muted:#8b8b90; --ring:#3a3a3e; --fill:#34c759; --accent:#0a84ff; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:400 16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; }
  #app{ min-height:100%; display:flex; flex-direction:column; align-items:center; }

  /* ---- setup / start screens ---- */
  .screen{ width:100%; max-width:440px; padding:32px 24px; display:flex; flex-direction:column;
    align-items:center; flex:1; justify-content:center; text-align:center; }
  h1{ font-size:24px; font-weight:600; margin:0 0 8px; }
  p.sub{ color:var(--muted); font-size:15px; margin:0 0 28px; max-width:320px; }
  input{ width:100%; background:#1c1c1e; border:1px solid #2c2c2e; color:var(--ink);
    border-radius:12px; padding:14px 16px; font-size:16px; outline:none; margin-bottom:14px; }
  input:focus{ border-color:var(--accent); }
  .btn{ width:100%; border:0; border-radius:14px; padding:15px; font-size:17px; font-weight:600;
    background:var(--accent); color:#fff; cursor:pointer; }
  .btn:disabled{ opacity:.4; }
  .btn.ghost{ background:transparent; color:var(--accent); }
  .err{ color:#ff453a; font-size:14px; min-height:18px; margin-top:6px; }
  .field{ width:100%; text-align:left; }
  label{ font-size:13px; color:var(--muted); margin:0 0 6px 4px; display:block; }

  /* ---- capture screen: the Face-ID aperture ---- */
  #capture{ display:none; padding:0; justify-content:flex-start; }
  .stage{ position:relative; width:min(86vw,360px); aspect-ratio:1; margin:8vh 0 0; }
  .aperture{ position:absolute; inset:0; border-radius:50%; overflow:hidden;
    -webkit-mask:radial-gradient(circle at center, #000 98%, transparent 100%); }
  .aperture video{ width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  .dim{ position:absolute; inset:-40%; background:#000; }               /* everything outside the circle */
  .dim::after{ content:""; position:absolute; inset:40%; border-radius:50%;
    box-shadow:0 0 0 100vmax #000; }
  svg.ring{ position:absolute; inset:-6%; width:112%; height:112%; transform:rotate(-90deg); pointer-events:none; }
  .tick{ stroke:var(--ring); stroke-width:3; stroke-linecap:round; transition:stroke .25s ease; }
  .tick.on{ stroke:var(--fill); }
  .prompt{ margin:36px 24px 0; text-align:center; }
  .prompt h2{ font-size:22px; font-weight:600; margin:0 0 6px; min-height:28px; }
  .prompt .hint{ color:var(--muted); font-size:15px; min-height:20px; }
  .controls{ margin-top:auto; padding:24px; display:flex; flex-direction:column; gap:4px; align-items:center; }
  .done-badge{ width:96px; height:96px; border-radius:50%; background:var(--fill);
    display:none; align-items:center; justify-content:center; margin:8vh auto 0; }
  .done-badge svg{ width:52px; height:52px; }
  .pill{ font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<div id="app">

  <!-- 1. connect + name -->
  <div id="setup" class="screen">
    <h1>Enroll a face</h1>
    <p class="sub">Add a household member so the guard recognizes them and stays quiet at the door.</p>
    <div class="field">
      <label>Guard address</label>
      <input id="scc" placeholder="https://192.168.1.5:8788" inputmode="url"/>
      <label>Access token</label>
      <input id="tok" placeholder="owner session / LAN token"/>
      <label>Person's name</label>
      <input id="name" placeholder="e.g. Amma" autocomplete="off"/>
    </div>
    <button id="go" class="btn">Continue</button>
    <div id="setup-err" class="err"></div>
  </div>

  <!-- 2. how-to (Apple-style) -->
  <div id="intro" class="screen" style="display:none">
    <div class="stage" style="margin-top:0"><svg class="ring" id="ring-intro" viewBox="0 0 100 100"></svg>
      <div style="position:absolute;inset:24%;display:flex;align-items:center;justify-content:center">
        <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#8b8b90" stroke-width="1.4">
          <circle cx="9" cy="10" r="1"/><circle cx="15" cy="10" r="1"/>
          <path d="M9 15c1 1 5 1 6 0" stroke-linecap="round"/></svg></div>
    </div>
    <h1 style="margin-top:32px">How to enroll</h1>
    <p class="sub">Position the face in the circle, then slowly turn a little left, then right, to capture three angles.</p>
    <button id="start" class="btn">Get started</button>
  </div>

  <!-- 3. capture -->
  <div id="capture" class="screen">
    <div class="stage">
      <div class="aperture"><video id="video" playsinline muted autoplay></video></div>
      <div class="dim"></div>
      <svg class="ring" id="ring" viewBox="0 0 100 100"></svg>
      <div class="done-badge" id="done">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>
      </div>
    </div>
    <div class="prompt">
      <h2 id="p-title">Position your face in the circle</h2>
      <div class="hint" id="p-hint"></div>
    </div>
    <div class="controls">
      <span class="pill" id="p-status">connecting…</span>
      <button id="restart" class="btn ghost">Start Over</button>
    </div>
  </div>

</div>

<script>
const $ = s => document.querySelector(s);
const POSES = ["frontal","left","right"];           // must match the SCC required_poses
const TICKS = 60;                                    // ring dot count (Face-ID style)

let SCC="", TOK="", NAME="", SID=null, stream=null, loopOn=false, detector=null, sending=false;

// ---------- ring rendering (three arcs) ----------
function buildRing(svg){
  svg.innerHTML="";
  for(let i=0;i<TICKS;i++){
    const a=(i/TICKS)*2*Math.PI, r1=45, r2=49, cx=50, cy=50;
    const l=document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("x1",cx+r1*Math.cos(a)); l.setAttribute("y1",cy+r1*Math.sin(a));
    l.setAttribute("x2",cx+r2*Math.cos(a)); l.setAttribute("y2",cy+r2*Math.sin(a));
    l.setAttribute("class","tick"); l.dataset.i=i; svg.appendChild(l);
  }
}
// fill the arc segments for captured poses (authoritative: driven by SCC 'captured')
function paintRing(capturedList){
  const per=TICKS/POSES.length;
  const filledPoses=new Set(capturedList);
  document.querySelectorAll("#ring .tick").forEach(t=>{
    const seg=Math.floor(parseInt(t.dataset.i)/per);
    t.classList.toggle("on", filledPoses.has(POSES[seg]));
  });
}

// ---------- local face detector (overlay only; NEVER recognition) ----------
// Uses the browser's native FaceDetector when present. Swap this one function for a
// bundled MediaPipe WASM detector in production; interface: detect(video) -> bool faceOk.
async function makeDetector(){
  if("FaceDetector" in window){
    const fd=new window.FaceDetector({fastMode:true, maxDetectedFaces:1});
    return async (video)=>{ try{ const f=await fd.detect(video); return f && f.length===1; }catch(e){ return true; } };
  }
  // Fallback: no native detector — assume a face is roughly present so the flow still runs.
  // (Production: replace makeDetector with a MediaPipe WASM build for smooth local tracking.)
  return async ()=> true;
}

// ---------- SCC B-protocol ----------
async function api(path, body){
  const r=await fetch(SCC+path,{ method:"POST", headers:{ "Content-Type":"application/json",
    "X-SCC-LAN-Token":TOK }, body:JSON.stringify(body||{}) });
  if(!r.ok) throw new Error("SCC "+r.status);
  return r.json();
}
function grabFrameB64(){
  const v=$("#video"), c=document.createElement("canvas");
  c.width=v.videoWidth||640; c.height=v.videoHeight||480;
  c.getContext("2d").drawImage(v,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",0.9).split(",")[1];
}

// ---------- capture loop ----------
async function captureLoop(){
  while(loopOn){
    let faceOk=true;
    try{ faceOk=await detector($("#video")); }catch(e){}
    // Local check is a HINT: only send a frame to the SCC when a face looks roughly present.
    if(faceOk && !sending){
      sending=true;
      try{
        const fb=await api("/enroll/frame",{ session_id:SID, image_b64:grabFrameB64() });
        applyFeedback(fb);                            // SCC verdict = the truth
        if(fb.state==="enrollment_complete"){ await finish(); return; }
      }catch(e){ $("#p-status").textContent="reconnecting…"; }
      sending=false;
    }
    await new Promise(r=>setTimeout(r, 120));         // ~8 fps to the SCC; overlay stays local
  }
}

// map SCC feedback -> Apple-style prompt + authoritative arc
const TITLE={ frontal:"Look straight ahead", left:"Turn slowly to your left", right:"Turn slowly to your right" };
function applyFeedback(fb){
  paintRing(fb.captured||[]);                         // arc advances ONLY on SCC 'captured'
  $("#p-status").textContent="";
  if(fb.current_target){
    $("#p-title").textContent=TITLE[fb.current_target]||"Position your face in the circle";
  }
  const r=fb.live_reason||"";
  const hint = r==="good, captured" ? "Great — hold still" :
               r==="hold steady" ? "Hold still…" :
               r.includes("no face") ? "Center your face in the circle" :
               r.includes("faces in frame") ? "Only one person, please" :
               r; // pass through "turn slightly left", "too blurry", "face too small", exposure, etc.
  $("#p-hint").textContent=hint;
}

async function finish(){
  loopOn=false;
  try{ await api("/enroll/finalize",{ session_id:SID }); }catch(e){}
  $("#ring").style.opacity=0; $("#video").parentElement.style.opacity=0;
  $("#done").style.display="flex";
  $("#p-title").textContent = NAME+" is enrolled";
  $("#p-hint").textContent = "The guard will recognize them at the door.";
  $("#restart").textContent="Done";
  stopCamera();
}

// ---------- lifecycle ----------
async function beginCapture(){
  show("capture"); buildRing($("#ring")); paintRing([]);
  try{
    stream=await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"user", width:640, height:640 } });
    $("#video").srcObject=stream;
  }catch(e){ $("#p-title").textContent="Camera blocked"; $("#p-hint").textContent="Allow camera access and reload."; return; }
  detector=await makeDetector();
  try{ const s=await api("/enroll/start",{ name:NAME }); SID=s.session_id; }
  catch(e){ $("#p-status").textContent="Can't reach the guard — check address, cert, token."; return; }
  loopOn=true; captureLoop();
}
function stopCamera(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } }
function show(id){ for(const s of ["setup","intro","capture"]) $("#"+s).style.display = s===id ? "flex":"none"; }

$("#go").onclick=()=>{
  SCC=$("#scc").value.trim().replace(/\/+$/,""); TOK=$("#tok").value.trim(); NAME=$("#name").value.trim();
  if(!SCC||!TOK||!NAME){ $("#setup-err").textContent="Fill in all three fields."; return; }
  buildRing($("#ring-intro")); document.querySelectorAll("#ring-intro .tick").forEach(t=>t.classList.add("on"));
  show("intro");
};
$("#start").onclick=beginCapture;
$("#restart").onclick=async ()=>{
  loopOn=false; stopCamera(); if(SID){ try{ await api("/enroll/cancel",{session_id:SID}); }catch(e){} SID=null; }
  $("#done").style.display="none"; $("#ring").style.opacity=1; $("#video").parentElement.style.opacity=1;
  $("#restart").textContent="Start Over"; show("setup");
};
</script>
</body>
</html>
